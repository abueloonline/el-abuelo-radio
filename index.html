<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio FM Musical en Vivo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-center items-center p-4 font-sans">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
    
    <!-- ENCABEZADO -->
    <div class="flex justify-between items-center border-b border-slate-800 pb-4">
      <div>
        <h1 class="font-bold text-xl text-violet-400">RADIO MUSICAL EN VIVO</h1>
        <p class="text-xs text-slate-400">Reproductor directo sin falsos datos</p>
      </div>
      <!-- ESTADO DE CONEXIÓN REAL -->
      <span id="statusBadge" class="bg-slate-800 text-slate-400 text-xs px-2.5 py-1 rounded-full font-mono">
        Detenido
      </span>
    </div>

    <!-- SELECTOR DE EMISORA -->
    <div>
      <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Elegí el género musical:</label>
      <select id="stationSelect" class="w-full bg-slate-800 text-slate-100 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:ring-2 focus:ring-violet-500 outline-none cursor-pointer">
        <option value="pop">🎵 Pop / Éxitos (Los 40)</option>
        <option value="cuarteto">💃 Cuarteto / Tropical (Cadena 3 / Popular)</option>
        <option value="rock">🎸 Rock / Hits (Rock & Pop 95.9)</option>
        <option value="lofi">☕ Chill & Lo-Fi Beats</option>
      </select>
    </div>

    <!-- DISPLAY -->
    <div class="text-center space-y-2 py-2">
      <img id="coverImg" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&auto=format&fit=crop&q=80" class="w-40 h-40 mx-auto rounded-xl object-cover shadow-lg border border-slate-700">
      <h2 id="stationTitle" class="text-lg font-bold text-white pt-2">Pop / Éxitos</h2>
      <p id="stationSub" class="text-xs text-slate-400">Stream Oficial en Directo</p>
    </div>

    <!-- CONTROLES -->
    <div class="flex items-center justify-center space-x-4 pt-2">
      <button id="playBtn" class="bg-violet-600 hover:bg-violet-500 active:scale-95 text-white w-16 h-16 rounded-full flex items-center justify-center shadow-lg transition">
        <i id="playIcon" class="fa-solid fa-play text-2xl pl-1"></i>
      </button>

      <div class="flex items-center space-x-2 bg-slate-800 px-3 py-2.5 rounded-xl border border-slate-700">
        <i class="fa-solid fa-volume-high text-slate-400 text-xs"></i>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.8" class="w-20 accent-violet-500">
      </div>
    </div>

    <p id="errorMessage" class="text-xs text-red-400 text-center hidden"></p>

  </div>

  <audio id="audioPlayer" crossorigin="anonymous"></audio>

  <script>
    // EMISORAS CON AUDIO DIRECTO Y VERIFICADO DE ALTA DISPONIBILIDAD
    const RADIOS = {
      pop: {
        name: "Los 40 Principales",
        sub: "Pop y Éxitos Internacionales",
        url: "https://27153.live.streamtheworld.com/LOS40_ARGENTINA.mp3",
        cover: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&auto=format&fit=crop&q=80"
      },
      cuarteto: {
        name: "Radio Popular / Cadena 3",
        sub: "Música Tropical & Cuarteto",
        url: "https://cadena3.amaze.com.ar/radio-popular.mp3",
        cover: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&auto=format&fit=crop&q=80"
      },
      rock: {
        name: "Rock & Pop",
        sub: "Clásicos y Rock en Español",
        url: "https://25213.live.streamtheworld.com/ROCKANDPOP_ARG.mp3",
        cover: "https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=400&auto=format&fit=crop&q=80"
      },
      lofi: {
        name: "Chill Lo-Fi Radio",
        sub: "Relax 24/7",
        url: "https://stream.zeno.fm/s4z4c9u3kwzuv",
        cover: "https://images.unsplash.com/photo-1518609878373-06d740f60d8b?w=400&auto=format&fit=crop&q=80"
      }
    };

    let isPlaying = false;
    const player = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const select = document.getElementById('stationSelect');
    const statusBadge = document.getElementById('statusBadge');
    const volumeSlider = document.getElementById('volumeSlider');
    const errorMessage = document.getElementById('errorMessage');

    function cargarEmisora(key) {
      errorMessage.classList.add('hidden');
      const radio = RADIOS[key];
      document.getElementById('stationTitle').textContent = radio.name;
      document.getElementById('stationSub').textContent = radio.sub;
      document.getElementById('coverImg').src = radio.cover;
      
      player.src = radio.url;
      player.load();

      if (isPlaying) {
        iniciarReproduccion();
      }
    }

    function iniciarReproduccion() {
      statusBadge.textContent = "Conectando...";
      statusBadge.className = "bg-amber-900/60 text-amber-400 text-xs px-2.5 py-1 rounded-full font-mono";
      
      player.play().then(() => {
        isPlaying = true;
        playIcon.className = 'fa-solid fa-pause text-2xl';
        statusBadge.textContent = "EN VIVO";
        statusBadge.className = "bg-emerald-950 text-emerald-400 border border-emerald-800 text-xs px-2.5 py-1 rounded-full font-mono animate-pulse";
      }).catch(err => {
        isPlaying = false;
        playIcon.className = 'fa-solid fa-play text-2xl pl-1';
        statusBadge.textContent = "Error";
        statusBadge.className = "bg-red-950 text-red-400 text-xs px-2.5 py-1 rounded-full font-mono";
        errorMessage.textContent = "No se pudo conectar a la emisora. Intentá apretar Play de nuevo o cambiar de radio.";
        errorMessage.classList.remove('hidden');
      });
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        player.pause();
        isPlaying = false;
        playIcon.className = 'fa-solid fa-play text-2xl pl-1';
        statusBadge.textContent = "Detenido";
        statusBadge.className = "bg-slate-800 text-slate-400 text-xs px-2.5 py-1 rounded-full font-mono";
      } else {
        if (!player.src) {
          player.src = RADIOS[select.value].url;
        }
        iniciarReproduccion();
      }
    });

    select.addEventListener('change', (e) => {
      cargarEmisora(e.target.value);
    });

    volumeSlider.addEventListener('input', (e) => {
      player.volume = e.target.value;
    });

    // Cargar emisora inicial
    cargarEmisora('pop');
  </script>
</body>
</html>
