<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radio FM En Vivo - Streaming & Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

  <!-- HEADER -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-gradient-to-tr from-violet-600 to-fuchsia-600 p-2.5 rounded-xl shadow-lg shadow-violet-500/30">
          <i class="fa-solid fa-radio text-xl text-white"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-violet-400 to-fuchsia-400 bg-clip-text text-transparent">PULSE MUSIC FM</h1>
          <p class="text-[10px] text-slate-400 font-medium">ESTACIÓN DE RADIO EN VIVO</p>
        </div>
      </div>

      <!-- OYENTES CONECTADOS EN VIVO -->
      <div class="flex items-center space-x-2 bg-emerald-950/60 border border-emerald-800/80 px-3.5 py-1.5 rounded-full text-xs text-emerald-400 font-semibold shadow-inner">
        <span class="relative flex h-2.5 w-2.5">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
        </span>
        <span id="userCountHeader">342</span>
        <span class="text-emerald-500 font-normal">oyentes en línea</span>
      </div>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow grid grid-cols-1 lg:grid-cols-3 gap-8 w-full">

    <!-- REPRODUCTOR PRINCIPAL DE RADIO (2 Col) -->
    <section class="lg:col-span-2 flex flex-col space-y-6">
      
      <!-- CARD REPRODUCTOR -->
      <div class="bg-gradient-to-b from-slate-900 to-slate-900/90 rounded-2xl p-6 sm:p-8 border border-slate-800 shadow-2xl relative overflow-hidden">
        <div class="absolute -top-24 -right-24 w-72 h-72 bg-violet-600/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- SELECTOR DE GÉNERO -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8 pb-6 border-b border-slate-800">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-1">Seleccionar Género Musical</label>
            <p class="text-xs text-slate-500">Cambia de emisora en tiempo real</p>
          </div>
          <select id="genreSelect" class="w-full sm:w-64 bg-slate-800 text-slate-200 border border-slate-700 text-sm font-medium rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-violet-500 cursor-pointer shadow-sm">
            <option value="Rock & Pop">🎸 Rock & Pop Classic</option>
            <option value="Electrónica">🎧 Electrónica / EDM</option
