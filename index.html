<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Onda Viva · Radio online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#eef1f6;--panel:#fff;--ink:#141722;--mute:#5d6577;--line:#d8dde8;--accent:#2d6bff;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--panel:#1b1e29;--ink:#eef0f6;--mute:#9aa2b6;--line:#2c3040;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--panel:#1b1e29;--ink:#eef0f6;--mute:#9aa2b6;--line:#2c3040;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "DM Sans",system-ui,sans-serif;transition:background .3s}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;margin:0;line-height:1.05}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 48px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font:800 22px "Bricolage Grotesque",sans-serif}
.logo span{color:var(--accent)}
.live{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.on-air .dot{background:#e5383b;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.hero{background:var(--accent);color:var(--on);border-radius:28px;padding:28px;transition:background .4s;overflow:hidden}
.hero h1{font-size:clamp(44px,9vw,92px);letter-spacing:-.03em}
.hero p{margin:10px 0 0;max-width:46ch;opacity:.92}
.row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;margin-top:24px}
.play{width:76px;height:76px;border-radius:50%;border:0;background:var(--on);color:var(--accent);font-size:28px;display:grid;place-items:center;transition:transform .15s}
.play:active{transform:scale(.94)}
.eq{display:flex;gap:5px;align-items:flex-end;height:56px}
.eq i{width:8px;height:10px;border-radius:4px;background:var(--on);opacity:.85}
.playing .eq i{animation:eq 0.9s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}.eq i:nth-child(5){animation-delay:-.45s}.eq i:nth-child(6){animation-delay:-.75s}
@keyframes eq{to{height:56px}}
.now{font-size:15px}
.now b{display:block;font:700 20px "Bricolage Grotesque",sans-serif}
.vol{display:flex;align-items:center;gap:10px;font-size:14px}
.vol input{accent-color:var(--on);width:110px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:26px}
.bar h2{font-size:24px}
.tog{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 16px;font-weight:700}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.dial{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;padding:12px 0 6px}
.st{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 14px;transition:border-color .2s,transform .2s}
.st b{display:block;font:700 18px "Bricolage Grotesque",sans-serif}
.st small{color:var(--mute)}
.st[aria-pressed="true"]{border-color:var(--c);transform:translateY(-3px)}
.st[aria-pressed="true"] small{color:var(--c)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px;margin-top:22px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:22px}
.card h2{font-size:26px;margin-bottom:14px}
.slot{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.slot:first-of-type{border-top:0}
.slot time{color:var(--mute);font-variant-numeric:tabular-nums}
.slot b{display:block}
.slot span{color:var(--mute);font-size:14px}
.slot.now-s{margin:0 -12px;padding:12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 14%,transparent);border-top-color:transparent}
.slot.now-s time{color:var(--accent);font-weight:700}
.chat{display:flex;flex-direction:column}
#msgs{height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.m{max-width:88%;padding:9px 13px;border-radius:16px 16px 16px 4px;background:var(--bg);word-wrap:break-word}
.m.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--accent);color:var(--on)}
.m small{display:block;font-weight:700;font-size:12px;opacity:.75}
.send{display:flex;gap:8px;margin-top:14px}
.send input{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.send .nm{flex:0 0 28%}
.send button{border:0;background:var(--accent);color:var(--on);border-radius:14px;padding:0 18px;font-weight:700}
.note{color:var(--mute);font-size:13px;margin:8px 0 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app">
<header>
  <div class="logo">Onda<span>Viva</span></div>
  <div class="live" id="live"><span class="dot"></span><span id="liveTxt">Fuera del aire</span></div>
</header>

<section class="hero" id="hero" aria-live="polite">
  <h1 id="gName">Rock</h1>
  <p id="gDesc"></p>
  <div class="row">
    <div style="display:flex;gap:18px;align-items:center">
      <button class="play" id="play" aria-label="Reproducir">▶</button>
      <div class="now">Ahora suena<b id="nowTxt"></b></div>
    </div>
    <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <label class="vol">Volumen <input type="range" id="vol" min="0" max="1" step=".05" value=".8"></label>
  </div>
</section>

<div class="bar">
  <h2>Elegí tus gustos</h2>
  <button class="tog" id="mixBtn" aria-pressed="false">Modo mezcla</button>
</div>
<p class="note" id="hint"></p>
<nav class="dial" id="dial" aria-label="Elegí un género"></nav>
<div class="chips" id="chips" role="group" aria-label="Estilos del género"></div>

<div class="grid">
  <section class="card">
    <h2>Programación de hoy</h2>
    <div id="sched"></div>
  </section>
  <section class="card chat">
    <h2>Chat en vivo</h2>
    <div id="msgs" aria-live="polite"></div>
    <div class="send">
      <input class="nm" id="nick" placeholder="Tu nombre" maxlength="16" aria-label="Tu nombre">
      <input id="txt" placeholder="Escribí un mensaje" maxlength="200" aria-label="Mensaje">
      <button id="go">Enviar</button>
    </div>
    <p class="note">Cada género tiene su propia sala.</p>
  </section>
</div>
</div>

<script>
// ► URL del stream de cada género (Icecast, Shoutcast, AzuraCast…).
// Para un estilo con stream propio agregá la clave "genero/Estilo", ej: "cumbia/Villera":"https://..."
// Si un estilo no tiene stream propio, usa el del género.
var STREAMS={
  rock:"https://ice1.somafm.com/seventies-128-mp3",
  cumbia:"https://stream-107.zeno.fm/esgo1lafgtstv",
  jazz:"https://ice1.somafm.com/lush-128-mp3"
};

// id, nombre, color, descripción, estilos
var D=[
["tropical","Tropical","#c4501b","Ritmos del Caribe para bailar todo el día.",["Merengue","Vallenato","Champeta","Soca"]],
["bachata","Bachata","#b8325f","Guitarras y romance desde Santo Domingo.",["Clásica","Moderna","Urbana"]],
["salsa","Salsa","#c0392b","Orquestas, soneos y mucha clave.",["Clásica","Romántica","Dura","Timba"]],
["folclore","Folclore","#8a6a1f","Las raíces de nuestra tierra.",["Chacarera","Zamba","Chamamé","Andino"]],
["rock","Rock","#d43b3b","Guitarras, riffs y clásicos de todas las épocas.",["Nacional","Clásico","Alternativo","Garage"]],
["clasica","Clásica","#4b5fa8","Los grandes compositores, a cualquier hora.",["Barroco","Romántico","Ópera","Piano"]],
["relax","Relajación","#2a8a8a","Sonidos suaves para bajar un cambio.",["Ambiente","Piano suave","Naturaleza","Meditación"]],
["poplatino","Pop latino","#d1307f","Los hits que suenan en toda Latinoamérica.",["Hits","Baladas pop","Dance"]],
["cumbia","Cumbia","#c47a0a","De la tradicional a la villera, para bailar.",["Romántica","Bailable","Villera","Santafesina","Cuartetera","Tradicional","Sonidera","Chicha"]],
["tango","Tango","#7a2f3d","Bandoneón, milonga y noches de Buenos Aires.",["Clásico","Milonga","Vals","Tango nuevo"]],
["jazz","Jazz","#7a4bc9","Swing, bossa y jazz moderno a cualquier hora.",["Swing","Bossa","Moderno","Vocal"]],
["romanticas","Románticas","#c2417c","Boleros y baladas para el corazón.",["Boleros","Baladas","Clásicas","Dúos"]],
["latino","Latino","#2f7d32","Lo mejor de la música latina.",["Hits","Clásicos","Mexicana","Brasileña"]],
["internacional","Internacional","#2d6bff","Éxitos de todo el mundo.",["Pop","Rock","Dance","Oldies"]]];

var H=["Lucho","Vero","Tomás","Cami","Nacho","Rochi","Maxi","Flor"];
var G=D.map(function(a,i){var n=a[1];return{id:a[0],n:n,c:a[2],d:a[3],u:a[4],s:[
[0,6,"Madrugada de "+n,H[i%8]],[6,12,"Mañanas de "+n,H[(i+1)%8]],[12,18,"Tardes de "+n,H[(i+2)%8]],[18,24,"Noche de "+n,H[(i+3)%8]]]}});

var $=function(i){return document.getElementById(i)};
var byId=function(id){return G.find(function(g){return g.id===id})};
var cur=G[0],sub=null,mix=false,sel=[],mi=0,timer=null,audio=new Audio(),playing=false;
var pad=function(h){return (h<10?"0":"")+h+":00"};
var nowSlot=function(g){var h=new Date().getHours();return g.s.find(function(x){return h>=x[0]&&h<x[1]})};
var streamUrl=function(){return (sub&&STREAMS[cur.id+"/"+sub])||STREAMS[cur.id]};

function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function save(){try{localStorage.setItem("ov-prefs",JSON.stringify({cur:cur.id,sub:sub,mix:mix,sel:sel}))}catch(e){}}
function restore(){
  var p=load("ov-prefs");if(!p)return;
  cur=byId(p.cur)||G[0];mix=!!p.mix;
  sel=(p.sel||[]).filter(byId);
  if(mix&&!sel.length)sel=[cur.id];
  if(mix&&sel.indexOf(cur.id)<0)cur=byId(sel[0]);
  sub=(!mix&&p.sub&&cur.u.indexOf(p.sub)>=0)?p.sub:null;
}

function render(){
  var ns=nowSlot(cur);
  document.documentElement.style.setProperty("--accent",cur.c);
  $("gName").textContent=mix?"Mi mezcla":cur.n;
  $("gDesc").textContent=mix?"Rotamos cada 10 minutos entre: "+sel.map(function(i){return byId(i).n}).join(", ")+".":cur.d;
  $("nowTxt").textContent=(mix?cur.n+" · ":"")+ns[2]+" · "+ns[3]+(sub?" · "+sub:"");
  $("mixBtn").setAttribute("aria-pressed",mix);
  $("hint").textContent=mix?"Tocá todos los géneros que quieras en tu mezcla.":"Tocá un género para escucharlo y elegí un estilo.";
  buildDial();buildChips();renderSched();loadChat();
}
function buildDial(){
  $("dial").innerHTML="";
  G.forEach(function(g){
    var on=mix?sel.indexOf(g.id)>=0:g.id===cur.id;
    var b=document.createElement("button");b.className="st";b.style.setProperty("--c",g.c);
    b.setAttribute("aria-pressed",on);
    b.innerHTML="<b>"+g.n+"</b><small>"+(mix&&on?"En tu mezcla":g.u.length+" estilos")+"</small>";
    b.onclick=function(){pick(g)};$("dial").appendChild(b);
  });
}
function buildChips(){
  $("chips").innerHTML="";if(mix)return;
  ["Todos"].concat(cur.u).forEach(function(s){
    var b=document.createElement("button");b.className="chip";b.textContent=s;
    b.setAttribute("aria-pressed",s==="Todos"?!sub:sub===s);
    b.onclick=function(){var was=playing;sub=s==="Todos"?null:s;render();save();if(was)start()};
    $("chips").appendChild(b);
  });
}
function renderSched(){
  var ns=nowSlot(cur);$("sched").innerHTML="";
  cur.s.forEach(function(x){
    var d=document.createElement("div");d.className="slot"+(x===ns?" now-s":"");
    d.innerHTML="<time>"+pad(x[0])+" – "+pad(x[1]%24)+"</time><div><b>"+x[2]+"</b><span>con "+x[3]+(x===ns?" · al aire ahora":"")+"</span></div>";
    $("sched").appendChild(d);
  });
}
function pick(g){
  var was=playing,prev=cur.id;
  if(mix){
    var i=sel.indexOf(g.id);
    if(i<0){sel.push(g.id);cur=g}
    else if(sel.length>1){sel.splice(i,1);if(cur.id===g.id)cur=byId(sel[0])}
  }else{if(g.id!==cur.id)sub=null;cur=g}
  mi=Math.max(0,sel.indexOf(cur.id));
  render();save();
  if(was&&cur.id!==prev)start();
}
$("mixBtn").onclick=function(){
  mix=!mix;sub=null;sel=mix?[cur.id]:[];mi=0;
  render();save();armMix();
};
function rotate(){mi=(mi+1)%sel.length;cur=byId(sel[mi]);render();save();start()}
function armMix(){
  clearInterval(timer);
  if(mix&&playing&&sel.length>1)timer=setInterval(rotate,600000);
}

function setState(on){
  playing=on;$("hero").classList.toggle("playing",on);$("live").classList.toggle("on-air",on);
  $("play").textContent=on?"❚❚":"▶";$("play").setAttribute("aria-label",on?"Pausar":"Reproducir");
  $("liveTxt").textContent=on?"En vivo · "+(mix?"Mi mezcla":cur.n):"Fuera del aire";
  armMix();
}
function start(){
  var u=streamUrl();
  if(u){
    audio.src=u;audio.volume=+$("vol").value;
    $("liveTxt").textContent="Conectando…";
    audio.play().catch(function(e){fail(e&&e.name?e.name:"error")});
    setState(true);
  }else{
    audio.pause();audio.removeAttribute("src");setState(false);
    $("liveTxt").textContent="Stream sin configurar para "+cur.n;
  }
}
function fail(why){
  setState(false);
  var msg=why==="NotAllowedError"?"El navegador bloqueó el audio, tocá ▶ de nuevo":"No se pudo conectar al stream ("+why+")";
  $("liveTxt").textContent=msg;
}
audio.onerror=function(){var c=audio.error?audio.error.code:0;if(playing||audio.src)fail("código "+c)};
audio.onplaying=function(){setState(true)};
$("play").onclick=function(){if(playing){audio.pause();setState(false)}else start()};
$("vol").oninput=function(){audio.volume=+this.value};

// Chat (demo: se guarda solo en este navegador)
var seed=[["Vero","¡Buenas! ¿Quién escucha?"],["Tomás","Pasen el tema del fin de semana por favor"]];
function loadChat(){
  var m=load("chat-"+cur.id)||seed;$("msgs").innerHTML="";
  m.forEach(addMsg);$("msgs").scrollTop=1e6;
}
function addMsg(m){
  var d=document.createElement("div");d.className="m"+(m[2]?" me":"");
  var s=document.createElement("small");s.textContent=m[0];
  d.appendChild(s);d.appendChild(document.createTextNode(m[1]));
  $("msgs").appendChild(d);
}
function send(){
  var t=$("txt").value.trim();if(!t)return;
  var n=$("nick").value.trim()||"Oyente";
  var m=(load("chat-"+cur.id)||seed).slice(-49);m.push([n,t,1]);
  try{localStorage.setItem("chat-"+cur.id,JSON.stringify(m))}catch(e){}
  addMsg([n,t,1]);$("txt").value="";$("msgs").scrollTop=1e6;
}
$("go").onclick=send;
$("txt").onkeydown=function(e){if(e.key==="Enter")send()};
restore();render();
</script>
</body>
</html>
