        function loadTrack(index) {

        function updatePlayPauseState() {
            const vinyl = document.getElementById('vinylDisc');
            const mainIcon = document.getElementById('mainPlayIcon');
            const mainText = document.getElementById('mainPlayText');

            if (isPlaying) {

                mainIcon.className = "fa-solid fa-pause text-lg";
                mainText.innerText = "Pausar";
                footerIcon.className = "fa-solid fa-pause text-xs";

                mainIcon.className = "fa-solid fa-play text-lg";

            const icon = document.getElementById('volumeIcon');
            realAudio.volume = val;

            } else if(val < 0.5) {
                icon.className = "fa-solid fa-volume-low text-xs";

        function initRealChat() {
            // Cargar mensajes guardados previamente
            const saved = localStorage.getItem('radio_chat_messages');
            if (saved) {
                try {
                    const messages = JSON.parse(saved);
                    messages.slice(-15).forEach(m => addChatMessage(m.user, m.message, m.isSelf));
                } catch(e){}
            }

        function addChatMessage(user, message, isSelf = false) {
            const container = document.getElementById('chatMessages');
            const msgEl = document.createElement('div');
            msgEl.className = isSelf 
                ? "bg-brand-600/20 p-2.5 rounded-xl border border-brand-500/40 text-slate-100" 
                : "bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 text-slate-300";
            
            msgEl.innerHTML = `
                <div class="flex items-center justify-between mb-0.5">
                    <span class="font-bold ${isSelf ? 'text-brand-300' : 'text-brand-400'}">${escapeHtml(user)}</span>
                    <span class="text-[9px] text-slate-500">${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                </div>
                <p class="text-slate-200">${escapeHtml(message)}</p>
            `;
            container.appendChild(msgEl);
            container.scrollTop = container.scrollHeight;
        }

        function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            const userInput = document.getElementById('chatUser');
            
            const val = input.value.trim();
            const userName = userInput.value.trim() || "Oyente_Radio";
            
            if(val) {
                // Agregar localmente
                addChatMessage(userName, val, true);
                
                // Transmitir a otras pestañas/oyentes activos
                chatChannel.postMessage({ user: userName, message: val });
                
                // Guardar historial local
                try {
                    const saved = JSON.parse(localStorage.getItem('radio_chat_messages') || '[]');
                    saved.push({ user: userName, message: val, isSelf: false });
                    localStorage.setItem('radio_chat_messages', JSON.stringify(saved.slice(-30)));
                } catch(e){}

                input.value = "";
            }
        }
